[package]
name = "warehouse_receipts"
version = "0.0.1"
edition = "2024"

[dependencies]
world = { git = "https://github.com/evefrontier/world-contracts.git", subdir = "contracts/world", rev = "d33ff232bd3878e8f9ad0721e18564b21facc925" }
multicoin = { git = "https://github.com/Algorithmic-Warfare/multicoin", subdir = "packages/multicoin", rev = "2772c26d24c02671726d39f167b8f772777875d9" }

[environments]
testnet_utopia = "4c78adac"
testnet_stillness = "4c78adac"
testnet_wip = "4c78adac"

[dep-replacements.testnet_wip]
multicoin = { use-environment = "testnet_stillness" }
world  = { use-environment = "testnet_stillness" }